[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.source-dir = "."

[project]
name = "caterpillar"
version = "2.9.0"
requires-python = ">=3.10"
description = "Library to pack and unpack structurized binary data."
authors = [{ name = "MatrixEditor" }]
maintainers = [{ name = "MatrixEditor" }]
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",

  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
]
# To ensure compatibility
dependencies = ["typing-extensions"]

[project.urls]
"Homepage" = "https://github.com/MatrixEditor/caterpillar"
"API-Docs" = "https://matrixeditor.github.io/caterpillar"

[project.optional-dependencies]
# compression
lzo = ["lzallright"]
crypt = ["cryptography"]
all = ["lzallright", "cryptography"]

[dependency-groups]
bench = [
    "construct>=2.10.70",
    "hachoir>=3.3.0",
    "kaitaistruct>=0.11",
    "mrcrowbar>=0.9.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "tox>=4.56.1",
]
docs = [
    "breathe>=4.36.0",
    "pydata-sphinx-theme>=0.19.0",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]
